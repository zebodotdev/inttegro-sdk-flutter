name: inttegro_flutter
description: Inttegro SDK for Flutter.
version: 0.1.0
homepage: https://flutter.inttegro.dev/
repository: https://github.com/zebodotdev/inttegro-sdk-flutter
issue_tracker: https://github.com/zebodotdev/inttegro-sdk-flutter/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.inttegro.flutter
        pluginClass: InttegroFlutterPlugin
      ios:
        pluginClass: InttegroFlutterPlugin
